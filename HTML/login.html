<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - TTGSHOP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="../images/LOGO TTGSHOP.png" alt="TTGSHOP Logo">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="products.html">Sản phẩm</a></li>
            </ul>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-box">
            <h2>Đăng Nhập Tài Khoản</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email đăng nhập</label>
                    <input type="email" id="login-email" required placeholder="Nhập email của bạn...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="login-password" required placeholder="Nhập mật khẩu...">
                </div>
                <button type="submit" class="btn-auth">Đăng Nhập</button>
            </form>
            <div class="auth-footer">
                Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
            </div>
        </div>
    </div>

    <footer>
        <div class="main-container footer-copyright" style="text-align: center; padding: 20px 0;">
            © 2026 TTGSHOP. All rights reserved.
        </div>
    </footer>

    <!-- Gọi tệp JavaScript xử lý đăng nhập -->
    <script src="../JS/login.js"></script>
</body>
</html>
