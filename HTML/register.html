<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - TTGSHOP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="../images/LOGO TTGSHOP.png" alt="TTGSHOP Logo">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="products.html">Sản phẩm</a></li>
            </ul>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-box">
            <h2>Đăng Ký Tài Khoản</h2>
            <form id="register-form">
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" id="reg-name" required placeholder="Nhập họ và tên...">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" required placeholder="Nhập email của bạn...">
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="reg-password" required minlength="6" placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)...">
                </div>
                <button type="submit" class="btn-auth">Đăng Ký</button>
            </form>
            <div class="auth-footer">
                Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
            </div>
        </div>
    </div>

    <footer>
        <div class="main-container footer-copyright" style="text-align: center; padding: 20px 0;">
            © 2026 TTGSHOP. All rights reserved.
        </div>
    </footer>

    <!-- Gọi tệp JavaScript xử lý đăng ký -->
    <script src="../JS/register.js"></script>
</body>
</html>
