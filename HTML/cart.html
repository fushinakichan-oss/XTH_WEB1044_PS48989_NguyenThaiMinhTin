<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - TTGSHOP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="../images/LOGO TTGSHOP.png" alt="TTGSHOP Logo">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Trang chủ</a></li>

            <div class="nav-right-actions">

                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count">0</span>

                <div class="auth-buttons">

        <div class="cart-container" id="cart-content-wrapper">

    </div>

    <footer>
        <div class="main-container footer-copyright" style="text-align: center; padding: 20px 0;">
