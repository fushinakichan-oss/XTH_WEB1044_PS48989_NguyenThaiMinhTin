<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán - TTGSHOP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="../images/LOGO TTGSHOP.png" alt="TTGSHOP Logo">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="products.html">Sản phẩm</a></li>
            </ul>
        </div>
    </header>

    <div class="main-container">
        <div class="section-header" style="margin-top: 20px;">
            <h2>💳 THÔNG TIN THANH TOÁN</h2>
        </div>

        <form id="checkout-form" class="checkout-container" onsubmit="handleCheckout(event)">
            <div class="checkout-form-box">
                <h3>Địa chỉ nhận hàng</h3>
                <div class="form-group">
                    <label>Họ và tên người nhận</label>
                    <input type="text" id="fullname" required placeholder="Nhập họ và tên...">
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="tel" id="phone" required placeholder="Nhập số điện thoại...">
                </div>
                <div class="form-group">
                    <label>Địa chỉ nhận hàng chi tiết</label>
                    <textarea id="address" rows="3" required placeholder="Số nhà, tên đường, phường/xã, quận/huyện..."></textarea>
                </div>
                <div class="form-group">
                    <label>Ghi chú đơn hàng (tùy chọn)</label>
                    <textarea id="note" rows="2" placeholder="Ghi chú về giao hàng, thời gian..."></textarea>
                </div>
            </div>

            <div class="checkout-summary-box">
                <h3>Đơn hàng của bạn</h3>
                <div id="checkout-items-summary">
                    <!-- Danh sách sản phẩm thu gọn render bằng JS -->
                </div>
                <div class="summary-total-row">
                    <span>Tổng tiền thanh toán:</span>
                    <span id="checkout-total-price" style="color: #d70018; font-size: 20px; font-weight: bold;">0 đ</span>
                </div>
                <button type="submit" class="btn-submit-order">Đặt hàng ngay</button>
            </div>
        </form>
    </div>

    <footer>
        <div class="main-container footer-copyright" style="text-align: center; padding: 20px 0;">
            © 2026 TTGSHOP. All rights reserved.
        </div>
    </footer>

    <script src="checkout.js"></script>
</body>
</html>
